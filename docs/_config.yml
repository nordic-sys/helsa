# Helsa documentation site — Jekyll config (GitHub Pages, served from /docs).
#
# Theme: Just the Docs (MIT). Chosen because it is documentation-shaped rather
# than blog-shaped: sidebar navigation, client-side search, readable measure,
# first-class mobile layout, and a dark colour scheme that ships with the theme.
# It is pulled in as a remote theme, so no vendored CSS lives in this repo.

title: Helsa
description: >-
  Self-hosted backend for the Helsa app. Your Apple Health data, on a server
  you run. MIT licensed. Not a medical device.

# ---------------------------------------------------------------------------
# ⚠️ baseurl MUST match how the site is published.
#
#   Project page  https://<user>.github.io/helsa/   ->  baseurl: "/helsa"
#   User/org page https://<user>.github.io/         ->  baseurl: ""
#   Custom domain https://docs.example.com/         ->  baseurl: ""
#
# If this is wrong, the pages still build but the stylesheet and every internal
# link resolve to the wrong prefix — the site renders as unstyled text. Check it
# first if the published site looks broken.
# ---------------------------------------------------------------------------
baseurl: "/helsa"
url: ""

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Light by default; _includes/head_custom.html switches to dark when the
# visitor's OS asks for it, and the sidebar toggle overrides both.
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  rel_url: true

heading_anchors: true

# Callout boxes. Pages mark a blockquote with {: .warning }, {: .important } or {: .note }.
# Without these definitions the blockquotes still render — they just lose the
# colour and the label — so nothing breaks if the theme changes this API.
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red

# Rendered at the bottom of every page.
back_to_top: true
back_to_top_text: "Back to top"

# The standing disclaimer and the colour-scheme toggle live in
# _includes/nav_footer_custom.html, which the theme renders in the sidebar on
# desktop and in the page footer on mobile.

# Repository links in the top-right corner. Point these at the public repo.
aux_links:
  "Source on GitHub":
    - "https://github.com/nordic-sys/helsa"
aux_links_new_tab: true

# Nothing here is user-generated, so no comment or analytics integration.
ga_tracking: null

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - SCREENSHOTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
