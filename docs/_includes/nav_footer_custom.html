<!--
  Sidebar footer: colour-scheme toggle plus the standing disclaimer.

  Note: the theme renders this include twice — once in the desktop sidebar and
  once in the mobile footer, each hidden at the other breakpoint. So this uses a
  class rather than an id, and updates every instance.
-->
<div class="helsa-nav-footer">
  <button class="helsa-theme-toggle" type="button" onclick="window.helsaToggleTheme()">
    Dark mode
  </button>
  <p style="font-size: 0.7rem; opacity: 0.7; margin-top: 0.75rem;">
    Not a medical device. No warranty.<br>
    MIT licensed.
  </p>
</div>

<script>
  (function () {
    var current = document.documentElement.getAttribute('data-helsa-theme');
    var label = current === 'dark' ? 'Light mode' : 'Dark mode';
    var buttons = document.querySelectorAll('.helsa-theme-toggle');
    for (var i = 0; i < buttons.length; i++) buttons[i].textContent = label;
  })();
</script>
