<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Helsa">
  <title>Helsa</title>
  <!--
    The Aurora arc. Decided 2026-06-13 in docs/14-arculat-design.md; this is the
    first time it exists as a file rather than as a description.

    Two aurora bands over a pulse line. The bands carry the gradient; the pulse
    uses currentColor, so one file works in both themes.

    The pulse is kept inside the arc's own width — extending it to the edges
    made the mark read as a gauge with a needle instead of a light over a
    horizon. The detail here dissolves below about 32px, which is why the
    favicon is a separate, simpler drawing rather than this file scaled down.
  -->
  <defs>
    <linearGradient id="helsa-aurora" x1="5" y1="23" x2="27" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7E8C" />
      <stop offset="0.36" stop-color="#2F7FB8" />
      <stop offset="0.68" stop-color="#4C5FC0" />
      <stop offset="1" stop-color="#2E9A5F" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 23a12 12 0 0 1 24 0" stroke="url(#helsa-aurora)" stroke-width="3" />
    <path d="M22.6 20.6A7 7 0 0 0 9.9 19.5" stroke="url(#helsa-aurora)" stroke-width="2.4" opacity="0.7" />
    <path d="M7 27.5h4.6l1.7-3.2 2.3 6.2 1.8-3H25" stroke="currentColor" stroke-width="2" />
  </g>
</svg>
