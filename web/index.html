<!doctype html>
<!-- `lang` is a placeholder: I18nProvider replaces it on mount with the language
     actually in force (stored choice → navigator.language → en). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Helsa</title>
    <!-- The SVG is the docs site's favicon (site/public/favicon.svg), drawn for
         16px and switching its pulse colour with the system theme. The PNGs are
         the app icon scaled down: a fallback for browsers without SVG favicons,
         and the tile iOS uses for "Add to Home Screen". -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
