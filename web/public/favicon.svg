<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Helsa">
  <title>Helsa</title>
  <!--
    The favicon is drawn separately from src/assets/logo.svg rather than scaled
    from it. At 16px the logo's second aurora band and its full pulse merge into
    a smudge, so this version drops the band, shortens the pulse and thickens
    both strokes.

    A favicon has no CSS context to inherit from, so the pulse colour is set
    explicitly and swapped by a media query inside the file.
  -->
  <style>
    .pulse { stroke: #0D1C21 }
    @media (prefers-color-scheme: dark) { .pulse { stroke: #E7EFF1 } }
  </style>
  <defs>
    <linearGradient id="helsa-aurora-icon" x1="4" y1="23" x2="28" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7E8C" />
      <stop offset="0.4" stop-color="#3468BE" />
      <stop offset="0.75" stop-color="#4C5FC0" />
      <stop offset="1" stop-color="#2E9A5F" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 23a12.4 12.4 0 0 1 24.8 0" stroke="url(#helsa-aurora-icon)" stroke-width="3.6" />
    <path d="M8 28h3.4l2-4 2.6 7.4 2.1-3.4H24" class="pulse" stroke-width="2.8" />
  </g>
</svg>
