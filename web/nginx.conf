server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /v1 is NOT served here: Caddy routes it separately to the API (docs/07 §4).
    # This container only serves the static build.

    # The SPA fallback: React Router's paths (/trends, /workouts, …) do not exist as
    # files, but index.html has to answer for them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ **`.mjs` is not in nginx's mime.types**, and the fallback is
    # `application/octet-stream` — which a browser REFUSES to execute as a module.
    # MapLibre's web worker is a `.mjs` (see the plugin in vite.config.ts), so
    # without this vector tiles never load: `new Worker(url, {type:'module'})`
    # fails on the MIME type, no error reaches the page, and the map renders its
    # background colour and nothing else. ⛔ Raster tiles keep working throughout,
    # because those are decoded on the main thread — so the failure appears in one
    # of the two map options and not the other.
    #
    # ⛔ **A `types { ... }` block here would be far worse than the bug.** At
    # server level it REPLACES the inherited map rather than adding to it, so
    # every other extension — index.html included — falls back to
    # `application/octet-stream`, and the browser downloads the site instead of
    # rendering it. `default_type` inside a location only fills the gap, and only
    # for the one extension that has one.
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The hashed assets can be cached for a long time; index.html never can.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
