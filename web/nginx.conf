server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /v1 is NOT served here: Caddy routes it separately to the API (docs/07 §4).
    # This container only serves the static build.

    # The SPA fallback: React Router's paths (/trends, /workouts, …) do not exist as
    # files, but index.html has to answer for them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The hashed assets can be cached for a long time; index.html never can.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
