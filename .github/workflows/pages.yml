# The public site at https://nordic-sys.github.io/helsa/
#
# It used to be built by GitHub's own Jekyll pipeline from the `docs/` folder.
# It is now an Astro build, which Pages cannot run for us — so this workflow
# builds it and uploads the result as the Pages artifact.
#
# ⚠️ This only takes effect once the repository's Pages source is switched from
# "Deploy from a branch" to "GitHub Actions". Until then this workflow runs,
# succeeds, and publishes nothing, while the old branch build stays live:
#
#   gh api -X PUT repos/nordic-sys/helsa/pages -f build_type=workflow
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the build input, and
      # a silent dependency bump is not something a docs site should do on its own.
      - run: npm ci

      # Runs the prebuild step too, which writes the legacy .html redirects.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
