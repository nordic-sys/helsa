# Container images for the backend and the web dashboard.
#
# They are published to GHCR so that running Helsa does not require building it.
# Building from source stays fully supported and documented — the images are a
# convenience, not the only path.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One image per component. `fail-fast: false` so that a broken web build
      # still leaves a usable backend image, and the log names the real failure
      # instead of a cancellation.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./web
    steps:
      - uses: actions/checkout@v5

      # ⚠️ Needed BEFORE buildx, and only because of the runtime stages. Go cross-compiles, so
      # the build stages never emulate — but the final alpine layer runs `apk add` for its own
      # architecture, and the GitHub runner is amd64. Without this the arm64 half of the build
      # fails on "exec format error" in a step that looks nothing like an architecture problem.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # ⚠️ This comment used to claim "`latest` only from the default branch", and that was
          # never true: `type=semver` only fires on a `v*` git tag, of which there were none, so
          # `latest` HAD NEVER BEEN PUBLISHED — while every default in `docker-compose.prod.yml`
          # pointed at it. Anyone following the quick start got `manifest unknown`, which reads
          # like a wrong image name rather than a missing tag.
          #
          # What actually happens now:
          #   a push to a branch      -> that branch's name (`main`)
          #   a `v*` tag              -> `1.2.3`, `1.2`, and `latest`
          #   every build             -> `sha-<short>`, which is the only immutable one
          #
          # `latest` deliberately still means "the newest RELEASE", not the tip of main. On a
          # server holding somebody's health data, a tag that silently follows development is
          # not a good default — the compose file points at `main` and says so, which is honest
          # today and stops meaning "development" the moment the first release exists.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # ⚠️ amd64 only was not a decision, it was the default — and it made the images
          # unrunnable on exactly the machines a self-hosted health server tends to live on:
          # a Raspberry Pi, an ARM VPS, an Apple Silicon Mac. `docker pull` failed with "no
          # matching manifest for linux/arm64/v8", which reads like a broken image rather than
          # a missing architecture. Both Dockerfiles cross-compile from `$BUILDPLATFORM`, so
          # this costs build time, not emulation.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
