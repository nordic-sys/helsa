# Helsa's RabbitMQ settings, mounted into /etc/rabbitmq/conf.d/.
#
# ⚠️ RabbitMQ 4 caps a message at 16 MiB by default. One ingest batch is one message, and a batch
# with the GPS tracks of twenty real workouts is ~10–15 MB — at the edge of that cap, and a longer
# hike goes over it. A refused publish surfaces as a 503 "Queue unreachable", which reads like an
# outage rather than a size problem. 64 MiB puts the proxy's 32 MB request-body limit in charge,
# which answers a clear 413 instead (helsa docs/34, 2026-10-27).
max_message_size = 67108864
