name: helsa

# Helsa — the DATA SERVICES (TimescaleDB + Redis + RabbitMQ). This is the BASE file.
#
# It deliberately publishes NO ports at all: the safe default is "they only talk on
# the internal Docker network". The dev overlay is what adds the ports.
#
#   local development:  make up        (-f docker-compose.yml -f docker-compose.dev.yml)
#   home VM:            make prod-up   (-f docker-compose.yml -f docker-compose.prod.yml)
#
# Plan: docs/07-infra-deployment.md

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18   # PG18 in the -ha image (Ubuntu + Toolkit + PostGIS + Patroni); the "most complete" Timescale. Pin to a concrete tag before production.
    container_name: helsa-timescaledb
    # ⚠️ TimescaleDB phones home by default: a daily "telemetry" job sends usage
    # data to Timescale (seen succeeding on a real install, 2026-10-28). The
    # project promises no phone-home, so it is switched off here, for every
    # install. The entrypoint passes these arguments on to postgres.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    # ⚠️ Memory ceilings, on every service: on 2026-11-09 one runaway read filled a
    # 4 GB server until it read the disk at ~1.9 GB/s for an hour and stopped
    # answering, even over ssh. With a ceiling the kernel stops the one container
    # that went over instead, and Docker starts it again. Sized for a 4 GB machine.
    mem_limit: 1792m
    # Docker gives a container 64 MB of /dev/shm; a parallel query keeps its
    # shared state there, and on that day asked for 724 MB and failed.
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helsa}
      POSTGRES_USER: ${POSTGRES_USER:-helsa}       # the OWNER: a superuser that owns the schema and runs the migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helsa_local_dev}
      # The application role's password, read ONCE: on the very first start the
      # entrypoint runs init/timescaledb/03-app-role.sql, which creates helsa_app
      # with it. Empty means no application role (local development). On an install
      # that already has data, `make prod-app-role` is the way in — see that file.
      HELSA_APP_DB_PASSWORD: ${HELSA_APP_DB_PASSWORD:-}
    volumes:
      # The -ha image creates PGDATA in the /home/postgres/pgdata/data subdirectory;
      # the named volume is mounted on the PARENT directory, so that initdb can chmod
      # the data subdirectory.
      - helsa_pgdata:/home/postgres/pgdata
      - ./init/timescaledb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helsa} -d ${POSTGRES_DB:-helsa}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Creates or repairs the application role (helsa_app) and its grants, as the
  # owner: `make prod-app-role` (or `make app-role` locally). Idempotent — the SQL
  # and the reasons are in init/timescaledb/03-app-role.sql. Under a profile, so
  # `up` never runs it. The same image as the database: it brings its own psql.
  #
  # The passwords travel as environment variables (PGPASSWORD, and psql's \getenv
  # inside the script) — never as arguments, which `ps` would show.
  app-role:
    profiles: ["tools"]
    image: timescale/timescaledb-ha:pg18
    entrypoint: ["psql", "--no-psqlrc", "-v", "ON_ERROR_STOP=1", "-f", "/helsa/03-app-role.sql"]
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-helsa}
      PGPASSWORD: ${POSTGRES_PASSWORD:-helsa_local_dev}
      PGDATABASE: ${POSTGRES_DB:-helsa}
      HELSA_APP_DB_PASSWORD: ${HELSA_APP_DB_PASSWORD:-}
      # Here an empty password is an error, not "local development": somebody
      # asked for the role by name.
      HELSA_APP_ROLE_REQUIRED: "1"
    volumes:
      - ./init/timescaledb/03-app-role.sql:/helsa/03-app-role.sql:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  redis:
    image: redis:8-alpine
    container_name: helsa-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-helsa_local_dev}", "--appendonly", "yes"]
    mem_limit: 128m
    volumes:
      - helsa_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD:-helsa_local_dev}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: helsa-rabbitmq
    # ⚠️ A fixed hostname, or a recreated container is a different broker. RabbitMQ
    # keeps its data under mnesia/rabbit@<hostname>, and Docker gives every new
    # container a new random hostname: on 2026-11-09 the recreate that added the
    # memory ceiling below started an empty node next to the old one, and the two
    # batches set aside in the dead-letter queue disappeared from view (they were
    # still on the volume, under the old name). A plain restart keeps the hostname;
    # a recreate — new image, new setting — does not.
    hostname: helsa-rabbitmq
    # RabbitMQ reads this ceiling and sets its own memory alarm (which slows
    # publishers rather than failing) below it.
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helsa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helsa_local_dev}
    volumes:
      - helsa_rabbitmqdata:/var/lib/rabbitmq
      # The 16 MiB default message cap is too small for a batch of real GPS tracks — see the file.
      - ./rabbitmq/10-helsa.conf:/etc/rabbitmq/conf.d/10-helsa.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  helsa_pgdata:
  helsa_redisdata:
  helsa_rabbitmqdata:
