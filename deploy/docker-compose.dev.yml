# Helsa — the LOCAL development overlay.
#
# This is what publishes the data services' ports to the host, so that a
# `go run ./cmd/api` on the workstation can reach them. The ports are deliberately
# non-default, so they do not clash with an existing local Postgres/Redis.
#
# Usage:  make up   (the Makefile adds the -f flags)
#
# ⚠️ DO NOT USE THIS on the home VM — there the prod overlay runs, and it exposes
# not a single data port.

services:
  timescaledb:
    ports:
      - "${TIMESCALE_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  rabbitmq:
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"     # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"   # management UI

  # A throwaway MQTT broker for testing the Home Assistant publisher.
  #
  # ⚠️ Behind a PROFILE on purpose: `make up` must not start it. Helsa does not
  # need a broker to run, and somebody who does not use Home Assistant should not
  # find one listening on their machine. Start it only while testing:
  #
  #   make mqtt-up     then    make mqtt-down
  #
  # It is anonymous and unencrypted (see mosquitto/mosquitto.dev.conf) — a real
  # deployment points HELSA_MQTT_URL at the broker Home Assistant already uses.
  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2
    container_name: helsa-mosquitto
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
