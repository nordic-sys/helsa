# Mosquitto — FOR LOCAL TESTING ONLY.
#
# ⚠️ Anonymous access, no TLS. This exists so that `make smoke` can watch what the
# publisher actually puts on a broker; it is not a broker to run anything real on.
# That is also why the service sits behind a compose profile and does not start
# with `make up`.
#
# A real deployment points HELSA_MQTT_URL at the broker Home Assistant already
# uses, with credentials, on the LAN — see docs/integrations/home-assistant.md.
listener 1883
allow_anonymous true

persistence false
log_dest stdout
